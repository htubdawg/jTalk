[package]
name = "jtalk"
version = "0.1.0"
edition = "2024"
default-run = "jtalk"
description = "Procedural English speech and MusicXML singing synthesizer"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
loqui-g2p = "0.4"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "jtalk-desktop"
path = "src/desktop/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
